<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NextQ UTDI - Antrean Pasien</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css?v=1.1">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased">
    <!-- Mobile Container -->
    <div class="max-w-md mx-auto bg-slate-900 min-h-screen relative shadow-2xl flex flex-col overflow-x-hidden">
        
        <!-- Header -->
        <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-20 shadow-md">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <i data-lucide="hospital" class="w-6 h-6 text-indigo-400"></i>
                    <h1 class="text-xl font-extrabold text-white tracking-tight">NextQ <span class="text-indigo-400">UTDI</span></h1>
                </div>
                <div class="text-[10px] uppercase tracking-wider bg-slate-800 text-slate-300 px-2 py-1 rounded-md border border-slate-700 font-bold">
                    Pasien View
                </div>
            </div>
            <div class="flex items-center gap-2 text-xs font-medium text-slate-400">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                Live Realtime Queue
            </div>
        </header>

        <!-- Calling Alert Banner -->
        <div id="callingAlertBox" class="hidden bg-amber-500 text-amber-950 p-4 text-center font-bold text-sm shadow-lg z-10 callingPulse relative border-b border-amber-600">
            <!-- Injected by JS -->
        </div>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto p-4 flex flex-col gap-6 pb-8">

            <!-- Active Ticket Section -->
            <section id="myTicketSection" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-500">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i data-lucide="ticket" class="w-4 h-4 text-indigo-400"></i> Tiket Aktif Anda
                </h2>
                
                <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-xl text-center relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-purple-500"></div>
                    
                    <div class="mb-1 text-sm font-bold text-indigo-400 uppercase tracking-wider" id="ticketServiceName">Layanan</div>
                    
                    <div class="text-7xl font-black text-white my-6 tracking-tighter drop-shadow-md" id="ticketCode">A-000</div>
                    
                    <div class="mb-8">
                        <span id="ticketStatusBadge" class="inline-flex items-center justify-center px-5 py-2 rounded-full text-sm font-bold shadow-sm">
                            Menunggu Giliran
                        </span>
                    </div>

                    <div class="grid grid-cols-2 gap-3 border-t border-slate-700 pt-5 mb-6 text-left">
                        <div class="bg-slate-900/50 p-3 rounded-2xl border border-slate-700/50">
                            <div class="text-[11px] text-slate-400 uppercase tracking-wider mb-1 font-semibold">Antrean di Depan</div>
                            <div class="font-bold text-slate-200 flex items-center gap-2 text-lg">
                                <i data-lucide="users" class="w-4 h-4 text-slate-500"></i> <span id="peopleAheadText">-</span>
                            </div>
                        </div>
                        <div class="bg-slate-900/50 p-3 rounded-2xl border border-slate-700/50">
                            <div class="text-[11px] text-slate-400 uppercase tracking-wider mb-1 font-semibold">Estimasi Waktu</div>
                            <div class="font-bold text-slate-200 flex items-center gap-2 text-lg">
                                <i data-lucide="clock" class="w-4 h-4 text-slate-500"></i> <span id="estimatedTimeText">-</span>
                            </div>
                        </div>
                    </div>

                    <button id="btnCancelTicket" onclick="batalTiket()" class="w-full py-4 rounded-2xl bg-red-500/10 text-red-400 border border-red-500/20 font-bold text-sm hover:bg-red-500/20 hover:text-red-300 transition-all active:scale-[0.98]">
                        Batalkan Tiket Ini
                    </button>
                </div>
            </section>

            <!-- Services Section -->
            <section id="servicesSection" class="hidden">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i data-lucide="stethoscope" class="w-4 h-4 text-indigo-400"></i> Ambil Antrean Baru
                </h2>
                <div id="servicesList" class="flex flex-col gap-3">
                    <!-- Rendered by JS -->
                </div>
            </section>
            
            <!-- Overview Section -->
            <section id="overviewSection" class="mt-4">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i data-lucide="activity" class="w-4 h-4 text-indigo-400"></i> Overview Antrean
                </h2>
                <div id="overviewList" class="grid grid-cols-1 gap-3">
                    <!-- Rendered by JS -->
                </div>
            </section>

        </main>
    </div>

    <script src="js/engine.js?v=1.1"></script>
    <script src="js/app.js?v=1.1"></script>
</body>
</html>
